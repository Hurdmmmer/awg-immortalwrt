name: Create Release on Tag

on:
  push:
    tags:
      - "v*.*.*"

  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt version (e.g., 24.10.4)"
        required: true
        type: string

      targets:
        description: "Targets (comma-separated, e.g. x86)"
        required: false
        type: string

      subtargets:
        description: "Subtargets (comma-separated, e.g. 64)"
        required: false
        type: string


# ============================================================
# 关键：
# softprops/action-gh-release 创建 GitHub Release 需要 contents: write
# ============================================================
permissions:
  contents: write


jobs:
  generate-config:
    runs-on: ubuntu-latest

    outputs:
      job-config: ${{ steps.generate-config.outputs.job-config }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.16.0"

      - name: Get ImmortalWrt version from inputs or tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

            if [ -n "${{ inputs.targets }}" ]; then
              echo "TARGETS=${{ inputs.targets }}" >> "$GITHUB_ENV"
            fi

            if [ -n "${{ inputs.subtargets }}" ]; then
              echo "SUBTARGETS=${{ inputs.subtargets }}" >> "$GITHUB_ENV"
            fi

          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            # workflow_call 传入的可能是 v24.10.4 或 24.10.4
            VERSION="${{ inputs.tag_name }}"
            VERSION="${VERSION#v}"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          else
            # refs/tags/v24.10.4 -> 24.10.4
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Show build parameters
        shell: bash
        run: |
          echo "VERSION=${{ env.VERSION }}"
          echo "TARGETS=${{ env.TARGETS }}"
          echo "SUBTARGETS=${{ env.SUBTARGETS }}"

      - name: Install dependencies
        run: npm install

      - name: Generate Job Config
        id: generate-config
        run: |
          node index.js \
            "${{ env.VERSION }}" \
            "${{ env.TARGETS }}" \
            "${{ env.SUBTARGETS }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    name: >-
      v${{ matrix.build_env.tag }}
      - ${{ matrix.build_env.pkgarch }}
      :: ${{ matrix.build_env.target }}/${{ matrix.build_env.subtarget }} build

    runs-on: ubuntu-latest
    needs: generate-config

    strategy:
      fail-fast: false
      matrix:
        build_env: ${{ fromJson(needs.generate-config.outputs.job-config) }}

    steps:
      - name: Checkout AWG source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pyelftools \
            zstd \
            xz-utils \
            curl \
            wget

      # ========================================================
      # SDK CACHE
      # ========================================================

      - name: Cache ImmortalWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        env:
          CACHE_NAME: >-
            cache-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}
        with:
          path: immortalwrt-sdk-*/
          key: ${{ runner.os }}-sdk-${{ env.CACHE_NAME }}

      # ========================================================
      # DOWNLOAD SDK
      # ========================================================

      - name: Download and extract ImmortalWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ImmortalWrt SDK"
          echo "Version:   ${{ matrix.build_env.tag }}"
          echo "pkgarch:   ${{ matrix.build_env.pkgarch }}"
          echo "target:    ${{ matrix.build_env.target }}"
          echo "subtarget: ${{ matrix.build_env.subtarget }}"
          echo "========================================"

          BASE_URL="https://downloads.immortalwrt.org/releases/${{ matrix.build_env.tag }}/targets/${{ matrix.build_env.target }}/${{ matrix.build_env.subtarget }}/"

          echo "SDK index:"
          echo "$BASE_URL"

          SDK_FILE="$(
            curl -fsSL "$BASE_URL" |
            grep -oE "immortalwrt-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}_gcc-[^\"]*_musl[^\"]*\.Linux-x86_64\.tar\.(zst|xz)" |
            head -n1
          )"

          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: SDK file not found."
            exit 1
          fi

          SDK_DOWNLOAD_URL="${BASE_URL}${SDK_FILE}"

          echo "Downloading:"
          echo "$SDK_DOWNLOAD_URL"

          wget --progress=dot:giga "$SDK_DOWNLOAD_URL"

          if [[ "$SDK_FILE" == *.tar.zst ]]; then
            tar --zstd -xf "$SDK_FILE"
          elif [[ "$SDK_FILE" == *.tar.xz ]]; then
            tar -xf "$SDK_FILE"
          else
            echo "ERROR: Unknown archive format: $SDK_FILE"
            exit 1
          fi

          rm -f "$SDK_FILE"

          echo
          echo "Extracted SDK:"
          find . -maxdepth 1 -type d -name "immortalwrt-sdk-*"


      # ========================================================
      # PREPARE SDK
      # ========================================================

      - name: Setup SDK and feeds
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: SDK directory not found"
            exit 1
          fi

          WORKSPACE_DIR="$(pwd)"

          echo "SDK_DIR=$SDK_DIR"
          echo "WORKSPACE_DIR=$WORKSPACE_DIR"

          cd "$SDK_DIR"

          echo "Updating feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "Copying AmneziaWG packages..."

          rm -rf package/kmod-amneziawg
          rm -rf package/amneziawg-tools
          rm -rf package/luci-proto-amneziawg

          cp -r "$WORKSPACE_DIR/kmod-amneziawg" package/
          cp -r "$WORKSPACE_DIR/amneziawg-tools" package/
          cp -r "$WORKSPACE_DIR/luci-proto-amneziawg" package/

          cat > .config <<'EOF'
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_PACKAGE_luci-i18n-amneziawg-ru=y
          EOF

          make defconfig

          echo
          echo "Selected configuration:"
          grep -E "AMNEZIA|amnezia" .config || true


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build AmneziaWG packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: SDK directory not found"
            exit 1
          fi

          cd "$SDK_DIR"

          echo "========================================"
          echo "Building kmod-amneziawg"
          echo "========================================"

          # 注意：
          # 这里不再使用 || true
          # kernel module 失败必须让整个 Workflow 失败
          make package/kmod-amneziawg/download V=s
          make package/kmod-amneziawg/prepare V=s
          make package/kmod-amneziawg/compile V=s

          echo
          echo "========================================"
          echo "Building amneziawg-tools"
          echo "========================================"

          make package/amneziawg-tools/download V=s
          make package/amneziawg-tools/prepare V=s
          make package/amneziawg-tools/compile V=s

          echo
          echo "========================================"
          echo "Building luci-proto-amneziawg"
          echo "========================================"

          make package/luci-proto-amneziawg/download V=s
          make package/luci-proto-amneziawg/prepare V=s
          make package/luci-proto-amneziawg/compile V=s

          echo
          echo "========================================"
          echo "Build completed"
          echo "========================================"

          find bin/ -type f \( -name "*.ipk" -o -name "*.apk" \) |
            grep -E "(amneziawg|luci-proto-amneziawg|luci-i18n-amneziawg)" ||
            {
              echo "ERROR: No AmneziaWG packages were generated."
              exit 1
            }


      # ========================================================
      # PREPARE OUTPUT
      # ========================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: SDK directory not found"
            exit 1
          fi

          rm -rf awgrelease
          mkdir -p awgrelease

          POSTFIX="v${{ matrix.build_env.tag }}_${{ matrix.build_env.pkgarch }}_${{ matrix.build_env.target }}_${{ matrix.build_env.subtarget }}"

          echo "POSTFIX=$POSTFIX"

          # amneziawg-tools
          find "$SDK_DIR/bin" \
            -type f \
            \( -name "amneziawg-tools*.ipk" -o -name "amneziawg-tools*.apk" \) \
            -exec sh -c '
              file="$1"
              postfix="$2"
              ext="${file##*.}"
              cp "$file" "awgrelease/amneziawg-tools_${postfix}.${ext}"
            ' _ {} "$POSTFIX" \;

          # LuCI protocol
          find "$SDK_DIR/bin" \
            -type f \
            \( -name "luci-proto-amneziawg*.ipk" -o -name "luci-proto-amneziawg*.apk" \) \
            -exec sh -c '
              file="$1"
              postfix="$2"
              ext="${file##*.}"
              cp "$file" "awgrelease/luci-proto-amneziawg_${postfix}.${ext}"
            ' _ {} "$POSTFIX" \;

          # Russian translation - optional
          find "$SDK_DIR/bin" \
            -type f \
            \( -name "luci-i18n-amneziawg-ru*.ipk" -o -name "luci-i18n-amneziawg-ru*.apk" \) \
            -exec sh -c '
              file="$1"
              postfix="$2"
              ext="${file##*.}"
              cp "$file" "awgrelease/luci-i18n-amneziawg-ru_${postfix}.${ext}"
            ' _ {} "$POSTFIX" \;

          # Kernel module
          find "$SDK_DIR/bin" \
            -type f \
            \( -name "kmod-amneziawg*.ipk" -o -name "kmod-amneziawg*.apk" \) \
            -exec sh -c '
              file="$1"
              postfix="$2"
              ext="${file##*.}"
              cp "$file" "awgrelease/kmod-amneziawg_${postfix}.${ext}"
            ' _ {} "$POSTFIX" \;

          echo
          echo "========================================"
          echo "Prepared packages:"
          echo "========================================"
          ls -lah awgrelease/

          # 这三个是必须的
          test "$(find awgrelease -maxdepth 1 -name 'kmod-amneziawg_*' | wc -l)" -gt 0 || {
            echo "ERROR: kmod-amneziawg package missing!"
            exit 1
          }

          test "$(find awgrelease -maxdepth 1 -name 'amneziawg-tools_*' | wc -l)" -gt 0 || {
            echo "ERROR: amneziawg-tools package missing!"
            exit 1
          }

          test "$(find awgrelease -maxdepth 1 -name 'luci-proto-amneziawg_*' | wc -l)" -gt 0 || {
            echo "ERROR: luci-proto-amneziawg package missing!"
            exit 1
          }


      # ========================================================
      # ACTIONS ARTIFACT
      #
      # 即使 GitHub Release 创建失败，
      # 你也可以在 Actions 页面直接下载这份 Artifact。
      # ========================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            amneziawg-v${{ matrix.build_env.tag }}-${{ matrix.build_env.pkgarch }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}
          path: awgrelease/*
          if-no-files-found: error
          retention-days: 30


      # ========================================================
      # GITHUB RELEASE
      # ========================================================

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.build_env.tag }}
          name: "AmneziaWG for ImmortalWrt v${{ matrix.build_env.tag }}"
          files: awgrelease/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
